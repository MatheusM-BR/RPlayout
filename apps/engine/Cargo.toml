[package]
name = "rplayout-engine"
version = "0.1.0"
edition = "2021"
description = "Engine de vídeo do RPlayout: um processo por canal, controlado por JSON-RPC no stdio."

[dependencies]
gstreamer = "0.23"
gstreamer-audio = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
gstreamer-app = "0.23"
gstreamer-base = { version = "0.23", features = ["v1_18"] }
libloading = "0.8"
quick-xml = "=0.42.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }

[[bin]]
name = "rplayout-engine"
path = "src/main.rs"

[[bin]]
name = "rplayout-relay"
path = "src/bin/relay.rs"

[profile.release]
opt-level = 2

[[bin]]
name = "rplayout-probe"
path = "src/bin/probe.rs"

[[bin]]
name = "rplayout-devices"
path = "src/bin/devices.rs"

[[bin]]
name = "rplayout"
path = "src/bin/launcher.rs"

[[bin]]
name = "rplayout-avsync"
path = "src/bin/avsync.rs"

[[bin]]
name = "rplayout-proxy"
path = "src/bin/proxy.rs"

[[bin]]
name = "rplayout-audio-analysis"
path = "src/bin/audio_analysis.rs"

[[bin]]
name = "rplayout-audio-bus-probe"
path = "src/bin/audio_bus_probe.rs"

[[bin]]
name = "rplayout-host-guard"
path = "src/bin/host_guard.rs"

[[bin]]
name = "rplayout-file-security"
path = "src/bin/file_security.rs"

[[bin]]
name = "rplayout-graphic-probe"
path = "src/bin/graphic_probe.rs"
